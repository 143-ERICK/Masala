<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Carrito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f6f3ee; }
    header { background:#8b1b1b; color:white; padding:14px 24px; display:flex; justify-content:space-between; }
    header a { color:white; text-decoration:none; margin-left:18px; }

    .container { padding:30px; max-width:900px; margin:auto; }
    h1 { text-align:center; }

    .item {
      background:white;
      border-radius:10px;
      padding:16px;
      margin-bottom:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }

    .btn {
      background:#8b1b1b;
      color:white;
      border:none;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    .total {
      font-size:20px;
      font-weight:bold;
      text-align:right;
      margin-top:20px;
    }

    .actions {
      margin-top:30px;
      display:flex;
      justify-content:space-between;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia3.html">Catálogo</a>
    <a href="historia10.html">Pagar</a>
  </nav>
</header>

<div class="container">
  <h1>Tu carrito</h1>

  <div id="carrito"></div>

  <div class="total">
    Total: $<span id="total">0</span>
  </div>

  <div class="actions">
    <a href="historia3.html">⬅ Seguir comprando</a>
    <a href="historia10.html" class="btn">Ir a pagar ➝</a>
  </div>
</div>

<script>
  // ✅ Productos simulados agregados desde catálogo
  let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

  function renderCarrito() {
    const contenedor = document.getElementById("carrito");
    const totalSpan = document.getElementById("total");
    contenedor.innerHTML = "";
    let total = 0;

    carrito.forEach((p, index) => {
      total += p.precio * p.cantidad;

      contenedor.innerHTML += `
        <div class="item">
          <div>
            <strong>${p.nombre}</strong><br>
            $${p.precio} x ${p.cantidad}
          </div>
          <div>
            <button class="btn" onclick="menos(${index})">−</button>
            <button class="btn" onclick="mas(${index})">+</button>
            <button class="btn" onclick="eliminar(${index})">✖</button>
          </div>
        </div>
      `;
    });

    totalSpan.textContent = total;
    localStorage.setItem("carrito", JSON.stringify(carrito));
  }

  function mas(index) {
    carrito[index].cantidad++;
    renderCarrito();
  }

  function menos(index) {
    if (carrito[index].cantidad > 1) {
      carrito[index].cantidad--;
    } else {
      carrito.splice(index, 1);
    }
    renderCarrito();
  }

  function eliminar(index) {
    carrito.splice(index, 1);
    renderCarrito();
  }

  renderCarrito();
</script>

</body>
</html>
