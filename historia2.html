<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Masala · Iniciar sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #8b1b1b, #c0392b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 30px 26px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #8b1b1b;
      margin-bottom: 6px;
    }

    .sublogo {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 14px;
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #8b1b1b;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn:hover {
      background: #a52727;
    }

    .links {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      color: #8b1b1b;
      text-decoration: none;
      font-weight: bold;
    }

    #mensaje {
      margin-top: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }

    .error {
      color: #c0392b;
    }

    .ok {
      color: #2e7d32;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">Masala</div>
    <div class="sublogo">Curry & Naan · Comida India</div>

    <h2>Iniciar sesión</h2>

    <form onsubmit="return false;">
      <label>Email</label>
      <input type="email" id="email" placeholder="cliente@masala.com" required>

      <label>Contraseña</label>
      <input type="password" id="pass" placeholder="••••••••" required>

      <button class="btn" onclick="login()">Entrar</button>
    </form>

    <p id="mensaje"></p>

    <div class="links">
      ¿No tienes cuenta?
      <a href="historia1.html">Crear cuenta</a>
    </div>

  </div>

  <!-- ✅ LOGIN REAL CON TU BACKEND JAVA -->
  <script>
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("pass").value;
      const mensaje = document.getElementById("mensaje");

      mensaje.innerText = "Validando...";
      mensaje.className = "";

      fetch("http://localhost:8080/MasalaBackend-Erick/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `email=${email}&password=${password}`
      })
      .then(response => response.text())
      .then(data => {
        if (data.toLowerCase().includes("correcto")) {
          mensaje.innerText = "✅ Acceso correcto. Redirigiendo...";
          mensaje.className = "ok";

          setTimeout(() => {
            window.location.href = "Raiz.html";
          }, 900);

        } else {
          mensaje.innerText = "❌ Correo o contraseña incorrectos";
          mensaje.className = "error";
        }
      })
      .catch(error => {
        mensaje.innerText = "❌ Error de conexión con el servidor";
        mensaje.className = "error";
        console.error(error);
      });
    }
  </script>

</body>
</html>
