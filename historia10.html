<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala · Pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f3ee;
      color: #222;
    }

    header {
      background: #8b1b1b;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-weight: bold;
    }

    .contenedor {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .pago-box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    .pago-box h2 {
      margin-bottom: 25px;
      color: #8b1b1b;
    }

    .campo {
      text-align: left;
      margin-bottom: 15px;
    }

    .campo label {
      font-size: 14px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0;
    }

    .btn-pagar {
      width: 100%;
      padding: 12px;
      background: #8b1b1b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-pagar:hover {
      background: #6f1515;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div><strong>Masala</strong> · curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia3.html">Catálogo</a>
  </nav>
</header>

<div class="contenedor">
  <div class="pago-box">

    <h2>Pago con tarjeta</h2>

    <div class="campo">
      <label>Nombre del titular</label>
      <input type="text" placeholder="Ej: Erick Hernández" required>
    </div>

    <div class="campo">
      <label>Número de tarjeta</label>
      <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" required>
    </div>

    <div class="fila">
      <div class="campo">
        <label>Vencimiento</label>
        <input type="text" placeholder="MM/AA" maxlength="5" required>
      </div>

      <div class="campo">
        <label>CVV</label>
        <input type="password" placeholder="123" maxlength="3" required>
      </div>
    </div>

    <div class="total">
      Total a pagar: $<span id="totalPago">0</span>
    </div>

    <button class="btn-pagar" onclick="procesarPago()">Pagar ahora</button>

  </div>
</div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
  // Traer el total desde el carrito
  const total = localStorage.getItem("totalCarrito") || 0;
  document.getElementById("totalPago").innerText = total;

  function procesarPago() {
    if (total == 0) {
      alert("Tu carrito está vacío");
      return;
    }

    // Simulación de pago exitoso
    setTimeout(() => {
      localStorage.removeItem("carrito");
      localStorage.removeItem("totalCarrito");
      window.location.href = "historia11.html"; // Pago aprobado
    }, 800);
  }
</script>

</body>
</html>
