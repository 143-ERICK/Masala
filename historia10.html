<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Mi perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family:Arial; background:#f6f3ee; }

    header {
      background:#8b1b1b;
      color:white;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a {
      color:white;
      text-decoration:none;
      margin-left:16px;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin:25px 0;
    }

    .contenedor {
      max-width:700px;
      margin:auto;
      background:white;
      border-radius:14px;
      padding:25px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
    }

    .dato {
      margin-bottom:14px;
      font-size:16px;
    }

    .dato strong {
      color:#8b1b1b;
    }

    .acciones {
      margin-top:30px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .btn {
      text-align:center;
      background:#8b1b1b;
      color:white;
      border:none;
      padding:12px 18px;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
      text-decoration:none;
    }

    .btn-cerrar {
      margin-top:25px;
      width:100%;
      background:#c0392b;
    }

    footer {
      text-align:center;
      padding:16px;
      color:#777;
      margin-top:30px;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia3.html">Catálogo</a>
  </nav>
</header>

<h1>Mi perfil</h1>

<div class="contenedor">

  <div class="dato">
    <strong>Correo:</strong> <span id="correo"></span>
  </div>

  <div class="dato">
    <strong>Estado de sesión:</strong> Activa
  </div>

  <div class="acciones">
    <!-- 👇 Ahora va al historial (historia11) -->
    <a class="btn" href="historia11.html">📦 Historial</a>
    <a class="btn" href="historia9.html">🚴 Estado del pedido</a>
    <a class="btn" href="historia12.html">🔔 Notificaciones</a>
    <a class="btn" href="historia5.html">🛒 Mi carrito</a>
  </div>

  <button class="btn btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>

</div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
  // ✅ Mostrar usuario logueado usando la misma key "usuario"
  const correoSpan = document.getElementById("correo");
  const usuario = localStorage.getItem("usuario");

  if (!usuario) {
    correoSpan.innerText = "No has iniciado sesión";
  } else {
    correoSpan.innerText = usuario;
  }

  // ✅ Cerrar sesión
  function cerrarSesion() {
    localStorage.removeItem("usuario");
    window.location.href = "historia2.html"; // Login
  }
</script>

</body>
</html>
