<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Notificaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family:Arial; background:#f6f3ee; }

    header {
      background:#8b1b1b;
      color:white;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a {
      color:white;
      text-decoration:none;
      margin-left:16px;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin:25px 0;
    }

    .contenedor {
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .notificacion {
      background:white;
      border-radius:14px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
      border-left:6px solid #8b1b1b;
    }

    .notificacion h3 {
      margin:0 0 6px;
    }

    .notificacion p {
      margin:0;
      font-size:14px;
      color:#444;
    }

    footer {
      text-align:center;
      padding:16px;
      color:#777;
      margin-top:30px;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia7.html">Historial</a>
  </nav>
</header>

<h1>Notificaciones</h1>

<div class="contenedor" id="notificaciones"></div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
let historial = JSON.parse(localStorage.getItem("historial")) || [];
let contenedor = document.getElementById("notificaciones");

if (historial.length === 0) {
  contenedor.innerHTML = `
    <div class="notificacion">
      <h3>Sin notificaciones</h3>
      <p>Aún no has realizado ningún pedido.</p>
    </div>
  `;
} else {

  let ultimoPedido = historial[historial.length - 1];

  contenedor.innerHTML = `
    <div class="notificacion">
      <h3>✅ Pedido recibido</h3>
      <p>Tu pedido fue recibido correctamente y está en preparación.</p>
    </div>

    <div class="notificacion">
      <h3>🚴 Pedido en camino</h3>
      <p>El repartidor ya va en camino a tu domicilio.</p>
    </div>

    <div class="notificacion">
      <h3>📦 Pedido entregado</h3>
      <p>Gracias por comprar en Masala. ¡Esperamos verte pronto!</p>
    </div>
  `;
}
</script>

</body>
</html>
