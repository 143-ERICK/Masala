<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Historial de pedidos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family:Arial; background:#f6f3ee; }

    header {
      background:#8b1b1b;
      color:white;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a {
      color:white;
      text-decoration:none;
      margin-left:16px;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin:30px 0;
    }

    .contenedor {
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .pedido {
      background:white;
      border-radius:14px;
      padding:16px;
      margin-bottom:20px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }

    .pedido h3 {
      margin:0 0 10px;
    }

    .producto {
      display:flex;
      justify-content:space-between;
      border-bottom:1px solid #ddd;
      padding:6px 0;
    }

    .total {
      font-weight:bold;
      text-align:right;
      margin-top:10px;
    }

    footer {
      text-align:center;
      padding:16px;
      color:#777;
      margin-top:30px;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia3.html">Catálogo</a>
  </nav>
</header>

<h1>Historial de pedidos</h1>

<div class="contenedor" id="historial"></div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
let historial = JSON.parse(localStorage.getItem("historial")) || [];
let contenedor = document.getElementById("historial");

if (historial.length === 0) {
  contenedor.innerHTML = "<p>No tienes pedidos registrados.</p>";
} else {
  historial.forEach((pedido, i) => {
    let html = `<div class="pedido">
      <h3>Pedido #${i + 1}</h3>`;

    let total = 0;

    pedido.forEach(p => {
      let subtotal = p.precio * p.cantidad;
      total += subtotal;

      html += `
        <div class="producto">
          <div>${p.nombre} x ${p.cantidad}</div>
          <div>$${subtotal.toLocaleString()}</div>
        </div>
      `;
    });

    html += `<div class="total">Total: $${total.toLocaleString()}</div></div>`;
    contenedor.innerHTML += html;
  });
}
</script>

</body>
</html>
