<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f6f3ee; }
    
    header {
      background:#8b1b1b;
      color:white;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a {
      color:white;
      text-decoration:none;
      margin-left:18px;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin:30px 0 10px;
    }

    .catalogo {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:20px;
      padding:30px;
      max-width:1200px;
      margin:auto;
    }

    .card {
      background:white;
      border-radius:14px;
      padding:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
      text-align:center;
    }

    .card img {
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:10px;
    }

    .card h3 { margin:10px 0 5px; }

    .precio {
      font-weight:bold;
      margin-bottom:10px;
    }

    .btn {
      background:#8b1b1b;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
    }

    footer {
      text-align:center;
      padding:16px;
      color:#777;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia5.html">Carrito</a>
  </nav>
</header>

<h1>Catálogo de productos</h1>

<div class="catalogo">

  <!-- Curry -->
  <div class="card">
    <img src="img/curry.jpg">
    <h3>Curry de pollo</h3>
    <div class="precio">$7.500</div>
    <button class="btn" onclick="agregar('Curry de pollo', 7500)">Agregar</button>
  </div>

  <!-- Naan -->
  <div class="card">
    <img src="img/naan.jpg">
    <h3>Naan de ajo</h3>
    <div class="precio">$2.100</div>
    <button class="btn" onclick="agregar('Naan de ajo', 2100)">Agregar</button>
  </div>

  <!-- Lassi -->
  <div class="card">
    <img src="img/lassi.jpg">
    <h3>Lassi de mango</h3>
    <div class="precio">$3.200</div>
    <button class="btn" onclick="agregar('Lassi de mango', 3200)">Agregar</button>
  </div>

  <!-- Samosas -->
  <div class="card">
    <img src="img/samosa.jpg">
    <h3>Samosas</h3>
    <div class="precio">$2.800</div>
    <button class="btn" onclick="agregar('Samosas', 2800)">Agregar</button>
  </div>

  <!-- Vada Pav -->
  <div class="card">
    <img src="img/vadapav.jpg">
    <h3>Vada Pav</h3>
    <div class="precio">$3.000</div>
    <button class="btn" onclick="agregar('Vada Pav', 3000)">Agregar</button>
  </div>

  <!-- Pakora Bhaji -->
  <div class="card">
    <img src="img/bhaji.jpg">
    <h3>Pakora Bhaji</h3>
    <div class="precio">$3.500</div>
    <button class="btn" onclick="agregar('Pakora Bhaji', 3500)">Agregar</button>
  </div>

  <div class="card">
    <img src="img/GulabJamun.jpg">
    <h3>Gulab Jamun</h3>
    <div class="precio">$2.500</div>
    <button class="btn" onclick="agregar('Gulab Jamun', 2500)">Agregar</button>
  </div>

  <div class="card">
    <img src="img/cocacola.jpg">
    <h3>Coca Cola</h3>
    <div class="precio">$1.500</div>
    <button class="btn" onclick="agregar('Coca Cola', 1500)">Agregar</button>
  </div>

</div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
function agregar(nombre, precio) {
  let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

  let producto = carrito.find(p => p.nombre === nombre);

  if (producto) {
    producto.cantidad++;
  } else {
    carrito.push({ nombre, precio, cantidad: 1 });
  }

  localStorage.setItem("carrito", JSON.stringify(carrito));
  alert("Producto agregado al carrito");
}
</script>

</body>
</html>
