<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Masala – Historias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    header {
      background: #8b1b1b;
      color: #fff;
      padding: 12px 16px;
      font-weight: bold;
    }
    .layout {
      display: flex;
      height: calc(100vh - 48px);
    }
    nav {
      width: 250px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }
    nav h2 {
      font-size: 14px;
      margin: 12px 16px 4px;
      color: #555;
      text-transform: uppercase;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    nav button:hover {
      background: #f0f0f0;
    }
    nav button.active {
      background: #ffe3d8;
      border-left: 4px solid #8b1b1b;
      padding-left: 12px;
    }
    .viewer {
      flex: 1;
      background: #eee;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .empty {
      padding: 24px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>Masala · Historias UI</header>
  <div class="layout">
    <nav>
      <h2>Pantallas</h2>
      <!-- Pon aquí exactamente los nombres de tus archivos -->
      <button data-page="historia1.html" class="active">Historia 1 – Login / Registro</button>
      <button data-page="historia2.html">Historia 2</button>
      <button data-page="historia3.html">Historia 3 – Catálogo</button>
      <button data-page="historia4.html">Historia 4</button>
      <button data-page="historia5.html">Historia 5</button>
      <button data-page="historia6.html">Historia 6</button>
      <button data-page="historia7.html">Historia 7</button>
      <button data-page="historia8.html">Historia 8</button>
      <button data-page="historia9.html">Historia 9</button>
      <button data-page="historia10.html">Historia 10</button>
      <button data-page="historia11.html">Historia 11</button>
      <button data-page="historia12.html">Historia 12</button>
    </nav>
    <div class="viewer">
      <!-- aquí se cargan las vistas -->
      <iframe id="vista" src="historia1.html"></iframe>
    </div>
  </div>

  <script>
    const buttons = document.querySelectorAll('nav button');
    const iframe = document.getElementById('vista');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // quitar activo
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // cambiar iframe
        const page = btn.getAttribute('data-page');
        iframe.src = page;
      });
    });
  </script>
</body>
</html>
