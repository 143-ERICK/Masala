<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Pago Rechazado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:#f6f3ee;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    .card {
      background:white;
      border-radius:16px;
      padding:40px 30px;
      max-width:420px;
      width:100%;
      text-align:center;
      box-shadow:0 6px 18px rgba(0,0,0,.2);
    }

    .error {
      font-size:60px;
      color:#c0392b;
    }

    h1 {
      margin:10px 0;
      color:#c0392b;
    }

    p {
      color:#444;
      font-size:15px;
      margin-bottom:20px;
    }

    .btn {
      background:#8b1b1b;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      margin-top:8px;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="error">❌</div>
  <h1>Pago rechazado</h1>
  <p>Ocurrió un problema con el pago.<br>Intenta nuevamente.</p>

  <button class="btn" onclick="reintentar()">Volver a intentar</button>
  <button class="btn" onclick="volver()">Volver al inicio</button>
</div>

<script>
function reintentar() {
  window.location.href = "historia6.html"; // vuelve al resumen
}

function volver() {
  window.location.href = "Raiz.html";
}
</script>

</body>
</html>
