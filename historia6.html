<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Resumen del pedido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family:Arial; background:#f6f3ee; }

    header {
      background:#8b1b1b;
      color:white;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a {
      color:white;
      text-decoration:none;
      margin-left:16px;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin:30px 0;
    }

    .contenedor {
      max-width:800px;
      margin:auto;
      background:white;
      border-radius:14px;
      padding:20px;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    .producto {
      display:flex;
      justify-content:space-between;
      border-bottom:1px solid #ddd;
      padding:10px 0;
    }

    .total {
      margin-top:20px;
      font-size:20px;
      font-weight:bold;
      text-align:right;
    }

    .acciones {
      margin-top:25px;
      display:flex;
      justify-content:space-between;
    }

    .btn {
      padding:10px 18px;
      border:none;
      border-radius:8px;
      font-size:15px;
      cursor:pointer;
      background:#8b1b1b;
      color:white;
      text-decoration:none;
    }

    footer {
      text-align:center;
      margin-top:30px;
      padding:16px;
      color:#777;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="historia3.html">Volver al catálogo</a>
    <a href="historia5.html">Carrito</a>
  </nav>
</header>

<h1>Resumen del pedido</h1>

<div class="contenedor" id="resumen"></div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
let resumen = document.getElementById("resumen");
let total = 0;

if (carrito.length === 0) {
  resumen.innerHTML = "<p>Tu carrito está vacío.</p>";
} else {
  carrito.forEach(p => {
    let subtotal = p.precio * p.cantidad;
    total += subtotal;

    resumen.innerHTML += `
      <div class="producto">
        <div>${p.nombre} x ${p.cantidad}</div>
        <div>$${subtotal.toLocaleString()}</div>
      </div>
    `;
  });

  resumen.innerHTML += `
    <div class="total">Total a pagar: $${total.toLocaleString()}</div>

    <div class="acciones">
      <a class="btn" href="historia5.html">Volver</a>
      <a class="btn" href="historia10.html">Pagar</a>
    </div>
  `;
}
</script>

</body>
</html>
