<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Masala | Carrito</title>
<style>
body{margin:0;font-family:Arial;background:#f6f2ed}
header{background:#8b1e1e;color:#fff;padding:15px;text-align:center}
table{width:90%;margin:30px auto;background:#fff;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:center}
button{background:#8b1e1e;color:#fff;border:none;padding:10px 20px;border-radius:6px}
</style>
</head>
<body>

<header><h2>Tu carrito</h2></header>

<table id="tabla">
<tr><th>Producto</th><th>Precio</th></tr>
</table>

<center>
<h3 id="total"></h3>
<button onclick="pagar()">Ir a pagar</button>
</center>

<script>
let c=JSON.parse(localStorage.getItem("carrito"))||[];
let t=0;

c.forEach(p=>{
tabla.innerHTML+=`<tr><td>${p.nombre}</td><td>$${p.precio}</td></tr>`;
t+=p.precio;
});

total.innerText="Total: $"+t;

function pagar(){
location.href="historia10.html";
}
</script>
</body>
</html>
