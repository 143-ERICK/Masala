<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estado del Pedido · Masala</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#f6f3ee;
      color:#222;
    }

    header{
      background:#8b1b1b;
      color:#fff;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a{
      color:#fff;
      text-decoration:none;
      font-weight:bold;
      margin-left:14px;
    }

    .container{
      max-width:600px;
      margin:40px auto;
      background:#fff;
      padding:30px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
      text-align:center;
    }

    h1{
      margin-bottom:10px;
    }

    .estado-pago{
      font-size:20px;
      font-weight:bold;
      margin-bottom:30px;
    }

    .aprobado{ color:#2e7d32; }
    .rechazado{ color:#c0392b; }

    .barra{
      display:flex;
      justify-content:space-between;
      margin-top:30px;
      position:relative;
    }

    .barra::before{
      content:"";
      position:absolute;
      top:50%;
      left:0;
      width:100%;
      height:4px;
      background:#ddd;
      transform:translateY(-50%);
      z-index:1;
    }

    .paso{
      position:relative;
      z-index:2;
      background:#ddd;
      color:#666;
      width:36px;
      height:36px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:bold;
    }

    .activo{
      background:#8b1b1b;
      color:#fff;
    }

    .etiquetas{
      display:flex;
      justify-content:space-between;
      font-size:12px;
      margin-top:10px;
      color:#555;
    }

    .btn{
      margin-top:30px;
      background:#8b1b1b;
      color:#fff;
      border:none;
      border-radius:8px;
      padding:10px 18px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn:hover{
      background:#a52727;
    }
  </style>
</head>

<body>

<header>
  <div><strong>Masala</strong> · Estado del Pedido</div>
  <div>
    <a href="Raiz.html">Inicio</a>
    <a href="historia3.html">Catálogo</a>
  </div>
</header>

<div class="container">

  <h1>Seguimiento de tu pedido</h1>

  <div id="estadoPago" class="estado-pago"></div>

  <div class="barra">
    <div class="paso" id="p1">1</div>
    <div class="paso" id="p2">2</div>
    <div class="paso" id="p3">3</div>
    <div class="paso" id="p4">4</div>
  </div>

  <div class="etiquetas">
    <span>Recibido</span>
    <span>Preparando</span>
    <span>Listo</span>
    <span>Entregado</span>
  </div>

  <button class="btn" onclick="avanzarEstado()">Avanzar estado</button>

</div>

<script>
  
  let pagoAprobado = true; // 🔴 Cambia a false para simular rechazo

  const estadoPago = document.getElementById("estadoPago");

  if(pagoAprobado){
    estadoPago.textContent = "✅ Pago aprobado correctamente";
    estadoPago.classList.add("aprobado");
  }else{
    estadoPago.textContent = "❌ Pago rechazado. Intenta nuevamente";
    estadoPago.classList.add("rechazado");
  }

  // -------------------------------
  // ESTADOS DEL PEDIDO
  // -------------------------------
  let estadoActual = 1;

  function marcarEstados(){
    for(let i=1;i<=4;i++){
      document.getElementById("p"+i).classList.remove("activo");
    }
    for(let i=1;i<=estadoActual;i++){
      document.getElementById("p"+i).classList.add("activo");
    }
  }

  function avanzarEstado(){
    if(estadoActual < 4){
      estadoActual++;
      marcarEstados();
    } else {
      alert("✅ Pedido entregado correctamente");
    }
  }

  if(pagoAprobado){
    marcarEstados();
  }
</script>

</body>
</html>
