<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masala • Estado del pedido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family:Arial; background:#f6f3ee; }

    header {
      background:#8b1b1b;
      color:white;
      padding:14px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header a {
      color:white;
      text-decoration:none;
      margin-left:16px;
      font-weight:bold;
    }

    h1 {
      text-align:center;
      margin:25px 0;
    }

    .contenedor {
      max-width:800px;
      margin:auto;
      background:white;
      border-radius:14px;
      padding:20px;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    .producto {
      display:flex;
      justify-content:space-between;
      border-bottom:1px solid #ddd;
      padding:10px 0;
    }

    .estado {
      margin-top:20px;
      padding:16px;
      border-radius:10px;
      background:#f1ece6;
      text-align:center;
      font-size:16px;
      font-weight:bold;
    }

    .progreso {
      display:flex;
      justify-content:space-between;
      margin-top:20px;
    }

    .paso {
      flex:1;
      text-align:center;
      padding:10px;
      border-bottom:4px solid #ccc;
      color:#777;
    }

    .activo {
      border-color:#8b1b1b;
      color:#8b1b1b;
      font-weight:bold;
    }

    .total {
      margin-top:20px;
      font-size:18px;
      font-weight:bold;
      text-align:right;
    }

    footer {
      text-align:center;
      padding:16px;
      color:#777;
      margin-top:30px;
    }
  </style>
</head>

<body>

<header>
  <div>Masala • curry & naan</div>
  <nav>
    <a href="Raiz.html">Inicio</a>
    <a href="historia7.html">Historial</a>
  </nav>
</header>

<h1>Estado de tu pedido</h1>

<div class="contenedor" id="pedido"></div>

<footer>
  Masala · Restaurante de comida india · Proyecto académico
</footer>

<script>
let historial = JSON.parse(localStorage.getItem("historial")) || [];
let contenedor = document.getElementById("pedido");

if (historial.length === 0) {
  contenedor.innerHTML = "<p>No tienes pedidos realizados.</p>";
} else {

  // ✅ Tomamos el ÚLTIMO pedido
  let pedido = historial[historial.length - 1];
  let total = 0;

  let html = "<h3>Último pedido</h3>";

  pedido.forEach(p => {
    let subtotal = p.precio * p.cantidad;
    total += subtotal;

    html += `
      <div class="producto">
        <div>${p.nombre} x ${p.cantidad}</div>
        <div>$${subtotal.toLocaleString()}</div>
      </div>
    `;
  });

  html += `
    <div class="total">Total: $${total.toLocaleString()}</div>

    <div class="estado">Estado actual: EN PREPARACIÓN</div>

    <div class="progreso">
      <div class="paso activo">En preparación</div>
      <div class="paso">En camino</div>
      <div class="paso">Entregado</div>
    </div>
  `;

  contenedor.innerHTML = html;
}
</script>

</body>
</html>
